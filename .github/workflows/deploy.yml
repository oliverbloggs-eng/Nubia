# Deploys to Hostinger over FTP when main changes.
# Add these in GitHub > Settings > Secrets and variables > Actions:
#   FTP_HOST, FTP_USER, FTP_PASS
# Hostinger FTP logins always start inside public_html, so server-dir paths are relative to it.
# nubia-shared sits outside public_html, where FTP cannot reach: upload shared/ there by hand
# in hPanel > File Manager whenever it changes.
# Database changes are NEVER run here. Run install/migrations/*.sql by hand in phpMyAdmin.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax check
        run: find system shared -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: System -> public_html/system
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          timeout: 120000
          local-dir: ./system/
          server-dir: system/
          state-name: .ftp-deploy-system.json

      - name: Website -> public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          timeout: 120000
          local-dir: ./site/
          server-dir: ./
          state-name: .ftp-deploy-site.json
          exclude: |
            **/.git*
            **/.git*/**
            system/**
            nubia-shared/**
